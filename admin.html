<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="web_dashboard" name="shell-type"/>
  <meta name="description" content="CivicFix Central Command - BBMP Municipal Urban Governance Portal"/>
  <title>CivicFix - Central Command Dashboard (BBMP)</title>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Leaflet CSS & JS for Spatial GIS Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00513b",
            "primary-container": "#176b50",
            "on-primary": "#ffffff",
            "on-primary-container": "#9be9c6",
            "primary-fixed": "#a4f3d0",
            "primary-fixed-dim": "#89d6b5",
            "secondary": "#48607d",
            "secondary-container": "#c3dcfe",
            "on-secondary": "#ffffff",
            "on-secondary-container": "#49617e",
            "tertiary": "#005136",
            "tertiary-container": "#006c49",
            "surface": "#effdf3",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#e9f7ed",
            "surface-container": "#e4f1e7",
            "surface-container-high": "#deece2",
            "surface-container-highest": "#d8e6dc",
            "on-surface": "#121e18",
            "on-surface-variant": "#3f4944",
            "outline": "#6f7973",
            "outline-variant": "#bec9c2",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"]
          },
          spacing: {
            "gutter": "1.5rem",
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "1rem",
            "space-lg": "1.5rem",
            "space-xl": "2rem"
          }
        }
      }
    };
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: #effdf3;
      color: #121e18;
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-surface antialiased">
  <div id="admin-root">
    <!-- Initial Loading Shell -->
    <div class="min-h-screen flex items-center justify-center">
      <div class="flex flex-col items-center gap-3">
        <div class="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
        <span class="text-xs font-semibold text-primary">Connecting to BBMP Central Command...</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { AdminApp } from './src/admin/adminApp.js';
    window.addEventListener('DOMContentLoaded', () => {
      AdminApp.init('admin-root');
    });
  </script>
</body>
</html>
